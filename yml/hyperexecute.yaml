version: "0.1"

runson: linux

runtime:
  language: node
  version: "20"

globalTimeout: 120

testSuiteTimeout: 120

testSuiteStep: 120

autosplit: true
concurrency: 1

env:
  CI: "true"

cacheKey: '{{ checksum "yarn.lock" }}'

cacheDirectories:
  - node_modules

pre:
  - corepack enable
  - yarn install --frozen-lockfile
  - yarn playwright install --with-deps chromium firefox webkit chrome

testDiscovery:
  type: raw
  mode: static
  command: echo "run-suite"

testRunnerCommand: yarn test

report: true

partialReports:
  frameworkName: playwright
  location: playwright-report
  type: html

uploadArtefacts:
  - name: Playwright Reports
    path:
      - playwright-report/**
      - test-results/**