version: "0.1"

runson: linux

globalTimeout: 120

testSuiteTimeout: 120

testSuiteStep: 120

autosplit: true

retryOnFailure: false

concurrency: 1

cacheKey: '{{ checksum "yarn.lock" }}'

cacheDirectories:
  - node_modules

pre:
  - corepack enable
  - yarn install --frozen-lockfile
  - yarn playwright install --with-deps

testDiscovery:
  type: raw
  mode: remote
  command: grep -lr 'test(' spec

testRunnerCommand: yarn playwright test $test

report: true

partialReports:
  frameworkName: playwright
  location: playwright-report
  type: HTML

uploadArtefacts:
  - name: Playwright Reports
    path:
      - playwright-report/**
      - test-results/**